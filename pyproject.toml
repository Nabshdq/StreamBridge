[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "streambridge"
version = "0.1.0"
description = "StreamBridge relay service"
requires-python = ">=3.11"


[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
streambridge = "streambridge.main:run"