[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "streambridge"
version = "0.1.0.dev0"
description = "Relay TikTok LIVE chat, gifts and follows to Twitch and YouTube live chat."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Nabil Shadiq" }]
keywords = ["tiktok", "twitch", "youtube", "live", "chat", "relay", "streaming"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
# Runtime dependencies are added in the phase that first needs them.
# TikTokLive is unofficial and changes often: pin it exactly, upgrade on purpose.
dependencies = [
    "TikTokLive==7.0.1",
    "httpx>=0.28.1",
    "keyring>=25.7",
    # Windows has no time-zone database; YouTube quota resets on Pacific time.
    "tzdata>=2024.1",
    # The desktop UI. Pinned exactly so the Qt runtime only changes on purpose.
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Nabshdq/StreamBridge"
Issues = "https://github.com/Nabshdq/StreamBridge/issues"

[project.scripts]
streambridge = "streambridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streambridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # Deprecation notices raised inside third-party libraries, not our code.
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:TikTokLive",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "N",   # naming conventions
]

[tool.ruff.lint.per-file-ignores]
# Qt's own API is camelCase (rowCount, roleNames, signal names), so overriding
# or declaring it in the UI layer must keep those names.
"src/streambridge/ui/*" = ["N802", "N815"]

[tool.ruff.format]
# Do not reformat code samples inside Markdown docs.
exclude = ["*.md"]
