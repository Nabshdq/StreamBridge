name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping to improve StreamBridge!
        You may write in English or Bahasa Indonesia.

        **Never paste tokens, passwords, API keys or `client_secret.json` here.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before it happened?
      placeholder: |
        1. Start the relay with a TikTok LIVE
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StreamBridge version
      description: Shown on the About screen.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: checkboxes
    id: destinations
    attributes:
      label: Destinations in use
      options:
        - label: Twitch
        - label: YouTube
  - type: textarea
    id: logs
    attributes:
      label: Log file (optional)
      description: |
        Attach `streambridge.log` from the About screen's "Open log folder"
        (or `%LOCALAPPDATA%\StreamBridge\logs\`). Logs contain viewer names
        and messages from the LIVE, but never logins or API keys.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include any token, password, API key or client_secret.json.
          required: true
