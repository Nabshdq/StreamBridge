name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! You may write in English or Bahasa Indonesia.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us about your stream and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like StreamBridge to help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead? (optional)
