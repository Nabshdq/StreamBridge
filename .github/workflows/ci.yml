# Runs lint and tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # StreamBridge is a Windows app, so tests run on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run tests (pytest)
        run: pytest
